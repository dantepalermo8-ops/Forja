<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORJA">
<meta name="theme-color" content="#0E0F11">
<title>FORJA — Entrenamiento</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<script>
(function(){
  try{
    var c=document.createElement('canvas'); c.width=180; c.height=180;
    var ctx=c.getContext('2d');
    var g=ctx.createLinearGradient(0,0,180,180); g.addColorStop(0,'#FF4F32'); g.addColorStop(1,'#C7300F');
    ctx.fillStyle=g; ctx.fillRect(0,0,180,180);
    ctx.fillStyle='#fff'; ctx.font='700 100px Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('F',92,102);
    var link=document.createElement('link'); link.rel='apple-touch-icon'; link.href=c.toDataURL('image/png');
    document.head.appendChild(link);
  }catch(e){}
})();

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0E0F11; --bg-elev:#17181B; --card:#1C1E22; --card-2:#202226;
  --border:#2A2C31; --text:#F2F1ED; --text-dim:#9A9DA6; --text-faint:#5D5F66;
  --accent:#FF4F32; --accent-ink:#2A0D06; --gold:#FFC53D; --gold-ink:#2E2205;
  --success:#3DDC84; --danger:#FF5C5C;
  --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"]{
  --bg:#F5F4F0; --bg-elev:#FFFFFF; --card:#FFFFFF; --card-2:#FAF9F6;
  --border:#E5E3DC; --text:#17181B; --text-dim:#6B6E76; --text-faint:#A2A4AA;
  --accent-ink:#FFE6E0; --gold-ink:#FFF3D6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:-0.01em; margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

#root{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(84px + var(--safe-bottom));}
#app{padding:16px 16px 8px; animation:viewIn .22s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.topbar{display:flex; align-items:center; justify-content:space-between; padding:4px 0 18px;}
.brand{display:flex; align-items:center; gap:8px;}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#C7300F);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:15px;}
.brand-name{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.02em;}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);}
.icon-btn:active{transform:scale(.93);}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px;}
.section-title{font-family:'Space Grotesk'; font-weight:600; font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.stack{display:flex; flex-direction:column; gap:10px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.pill{display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--card-2); color:var(--text-dim); border:1px solid var(--border);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;}

.btn{border:none; border-radius:var(--radius-s); padding:13px 18px; font-weight:600; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:#fff;}
.btn-secondary{background:var(--card-2); color:var(--text); border:1px solid var(--border);}
.btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}
.btn-danger{background:rgba(255,92,92,.12); color:var(--danger); border:1px solid rgba(255,92,92,.3);}
.btn-block{width:100%;}
.btn-lg{padding:17px; font-size:16px; border-radius:var(--radius-m);}

.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; color:var(--text-dim); font-weight:600;}
.field input, .field select, .field textarea{
  background:var(--card-2); border:1px solid var(--border); border-radius:var(--radius-s);
  padding:12px 12px; color:var(--text); font-size:15px; width:100%;
}
.field textarea{resize:vertical; min-height:60px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:-1px;}

/* Dashboard */
.hero{background:linear-gradient(160deg,var(--card) 0%, var(--card-2) 100%); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px; position:relative; overflow:hidden;}
.hero::after{content:"";position:absolute; right:-40px; top:-40px; width:140px; height:140px; background:radial-gradient(circle,var(--accent-ink) 0%, transparent 70%);}
.greeting{color:var(--text-dim); font-size:13.5px; margin-bottom:2px;}
.big-name{font-size:22px; margin-bottom:14px;}
.today-routine{display:flex; align-items:center; justify-content:space-between; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; margin-top:2px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.stat-box{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-s); padding:12px;}
.stat-num{font-family:'Space Grotesk'; font-weight:700; font-size:19px;}
.stat-label{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.week-bars{display:flex; align-items:flex-end; gap:6px; height:54px; margin-top:8px;}
.week-bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:5px;}
.week-bar{width:100%; border-radius:5px 5px 2px 2px; background:var(--border); min-height:4px;}
.week-bar.active{background:var(--accent);}
.week-bar-label{font-size:10px; color:var(--text-faint);}

/* Cards lists */
.item-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px;}
.item-card + .item-card{margin-top:10px;}
.muscle-Espalda{color:#6FB7FF;background:rgba(111,183,255,.13);} .muscle-Pecho{color:#FF8FA3;background:rgba(255,143,163,.13);}
.muscle-Piernas{color:#8FE0A8;background:rgba(143,224,168,.13);} .muscle-Hombros{color:#FFD08A;background:rgba(255,208,138,.13);}
.muscle-Biceps{color:#C6A7FF;background:rgba(198,167,255,.13);} .muscle-Triceps{color:#7DE0DC;background:rgba(125,224,220,.13);}
.muscle-Core{color:#FFE28A;background:rgba(255,226,138,.13);} .muscle-Personalizado{color:#D9DBDF;background:rgba(217,219,223,.13);}

.empty-state{text-align:center; padding:38px 16px; color:var(--text-dim);}
.empty-state .em-icon{font-size:32px; margin-bottom:10px;}
.empty-state .em-title{color:var(--text); font-weight:600; margin-bottom:4px;}

/* Bottom nav */
.bottom-nav{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; z-index:40;
  background:linear-gradient(to top, var(--bg) 60%, transparent);
  padding-top:14px;}
.nav-inner{max-width:520px; width:100%; margin:0 auto; background:var(--bg-elev); border:1px solid var(--border);
  border-radius:20px; display:flex; align-items:center; justify-content:space-around; padding:9px 8px calc(9px + var(--safe-bottom)); margin:0 14px calc(10px + var(--safe-bottom));
  box-shadow:0 8px 30px rgba(0,0,0,.35);}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); background:none; border:none; padding:5px 8px; border-radius:12px; font-size:10.5px; font-weight:600;}
.nav-item.active{color:var(--text);}
.nav-item svg{width:21px;height:21px;}
.nav-item.active svg{color:var(--accent);}
.nav-train{background:var(--accent); color:#fff !important; width:54px; height:54px; border-radius:17px; margin-top:-26px; box-shadow:0 6px 18px rgba(255,79,50,.45); justify-content:center;}
.nav-train svg{width:24px;height:24px;color:#fff;}
.nav-train span{display:none;}

/* Workout */
.set-row{display:grid; grid-template-columns:28px 1fr 1fr 44px; gap:8px; align-items:center; padding:8px 0;}
.set-row.done{opacity:.55;}
.set-idx{font-family:'Space Grotesk'; font-weight:700; color:var(--text-dim); font-size:13px;}
.stepper{display:flex; align-items:center; background:var(--card-2); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
.stepper button{width:30px; height:38px; background:none; border:none; color:var(--text); font-size:17px; font-weight:600;}
.stepper button:active{background:var(--border);}
.stepper input{border:none; background:none; width:100%; text-align:center; font-weight:700; font-size:15px; padding:0;}
.check-btn{width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--card-2); display:flex; align-items:center; justify-content:center; color:var(--text-faint);}
.check-btn.on{background:var(--success); border-color:var(--success); color:#0E0F11;}
.prev-hint{font-size:11px; color:var(--text-faint); grid-column:2 / span 2; margin-top:-4px;}
.ex-block{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px 6px; margin-bottom:12px;}
.ex-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
.ex-name{font-family:'Space Grotesk'; font-weight:700; font-size:16px;}
.ex-note{font-size:12px; color:var(--text-dim); margin:4px 0 8px;}

/* Overlays */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.sheet{max-width:520px; width:100%; background:var(--bg-elev); border-radius:24px 24px 0 0; padding:22px 18px calc(22px + var(--safe-bottom)); max-height:88vh; overflow-y:auto; animation:sheetUp .22s cubic-bezier(.2,.8,.3,1);}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:none; opacity:1;}}
.sheet-grabber{width:36px;height:4px;background:var(--border); border-radius:2px; margin:0 auto 16px;}
.modal-center{position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.65); padding:24px;}
.modal-box{background:var(--bg-elev); border-radius:var(--radius-l); padding:22px; max-width:380px; width:100%; text-align:center; animation:sheetUp .18s ease;}

.rest-overlay{position:fixed; inset:0; z-index:95; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
.rest-ring{width:230px; height:230px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:26px;}
.rest-time{font-family:'Space Grotesk'; font-weight:700; font-size:52px;}
.rest-sub{color:var(--text-dim); font-size:13px; margin-top:4px;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:18px 0;}
.chip{padding:8px 14px; border-radius:999px; background:var(--card); border:1px solid var(--border); font-size:13px; font-weight:600; color:var(--text-dim);}
.chip.sel{background:var(--accent); color:#fff; border-color:var(--accent);}

.pr-toast{position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:120; background:linear-gradient(120deg,var(--gold),#FF9F1C); color:#2A1D00; font-weight:700; padding:12px 20px; border-radius:999px; box-shadow:0 10px 26px rgba(0,0,0,.35); font-size:13.5px; display:flex; align-items:center; gap:8px; animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3);}
@keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(-20px) scale(.9);} to{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}}

.tabbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{white-space:nowrap; padding:8px 14px; border-radius:999px; background:var(--card); border:1px solid var(--border); color:var(--text-dim); font-weight:600; font-size:13px;}
.tab-btn.active{background:var(--text); color:var(--bg);}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:6px;}
.cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; font-size:12.5px; color:var(--text-dim); position:relative; background:var(--card); border:1px solid var(--border);}
.cal-cell.out{opacity:.25; background:none; border-color:transparent;}
.cal-cell.trained{background:var(--accent-ink); color:var(--text); border-color:transparent; font-weight:700;}
.cal-cell.sel{outline:2px solid var(--accent);}
.cal-dow{font-size:10.5px; color:var(--text-faint); text-align:center; font-weight:700;}

.loading-screen{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:200;}
.spinner{width:34px;height:34px;border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toggle{width:44px; height:26px; border-radius:999px; background:var(--card-2); border:1px solid var(--border); position:relative; flex-shrink:0;}
.toggle.on{background:var(--accent); border-color:var(--accent);}
.toggle::after{content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s;}
.toggle.on::after{left:20px;}

.reorder-btns{display:flex; flex-direction:column; gap:2px;}
.reorder-btns button{width:22px; height:18px; border:none; background:var(--card-2); color:var(--text-dim); border-radius:4px; font-size:10px; line-height:1;}
.sw-item{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--border);}
.sw-item:last-child{border-bottom:none;}

svg.icon{width:18px;height:18px;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}
.small{font-size:12px;}
.center{text-align:center;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;} .mb8{margin-bottom:8px;}
</style>
</head>
<body>
<div id="root">
  <div id="app"></div>
  <div class="bottom-nav">
    <div class="nav-inner" id="navInner"></div>
  </div>
</div>
<div id="overlays"></div>

<script>
/* ============ ICONOS ============ */
const ICONS = {
  home:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  routines:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 4 4m0 0 2.5 2.5M4 4l16 16m0 0-2.5-2.5M20 20l2.5 2.5M14 6l4 4M6 14l4 4"/><path d="M17 3l4 4-3 3-4-4zM3 17l4 4 3-3-4-4z"/></svg>',
  progress:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M7 16V9m5 7V5m5 11v-5"/></svg>',
  profile:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>',
  plus:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  edit:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  copy:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  trash:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6z"/></svg>',
  check:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
  trophy:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 5M17 5h3a3 3 0 0 1-3 5"/></svg>',
  clock:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  search:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  close:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  sun:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
  cal:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  bell:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>',
};

/* ============ DATOS BASE ============ */
const GROUPS = ['Espalda','Pecho','Piernas','Hombros','Biceps','Triceps','Core'];
const GROUP_LABEL = {Espalda:'Espalda',Pecho:'Pecho',Piernas:'Piernas',Hombros:'Hombros',Biceps:'Bíceps',Triceps:'Tríceps',Core:'Core',Personalizado:'Personalizado'};

const EXLIB = [
  {id:'remo_medio',name:'Remo medio',group:'Espalda'},{id:'jalon_pecho',name:'Jalón al pecho',group:'Espalda'},
  {id:'remo_t',name:'Remo en T',group:'Espalda'},{id:'remo_unilateral',name:'Remo unilateral',group:'Espalda'},
  {id:'face_pull',name:'Face pull',group:'Espalda'},{id:'dominadas',name:'Dominadas',group:'Espalda'},
  {id:'press_banca',name:'Press banca',group:'Pecho'},{id:'press_inclinado',name:'Press inclinado',group:'Pecho'},
  {id:'aperturas',name:'Aperturas',group:'Pecho'},{id:'fondos',name:'Fondos',group:'Pecho'},

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function todayISO(d=new Date()){ return d.toISOString().slice(0,10); }
function fmtDate(iso){
  const d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDur(sec){
  sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60;
  return m+' min'+(s>0 && m<1?' '+s+' s':'');
}
function fmtDurShort(sec){
  const m=Math.floor(sec/60); return m+' min';
}
function fmtNum(n){ return Math.round(n*10)/10; }
function fmtVol(n){ return Math.round(n).toLocaleString('es-ES')+' '+(DB.profile?DB.profile.units:'kg'); }

/* Capa de almacenamiento: usa el storage de Claude cuando está disponible (dentro del chat)
   y localStorage cuando la app corre de forma independiente (instalada en el iPhone). */
const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
async function storageGet(key){
  if(hasClaudeStorage){ try{ const r=await window.storage.get(key); return r?r.value:null; }catch(e){ return null; } }
  try{ return localStorage.getItem('forja:'+key); }catch(e){ return null; }
}
async function storageSet(key,val){
  if(hasClaudeStorage){ try{ await window.storage.set(key,val); }catch(e){} return; }
  try{ localStorage.setItem('forja:'+key,val); }catch(e){}
}
async function storageDelete(key){
  if(hasClaudeStorage){ try{ await window.storage.delete(key); }catch(e){} return; }
  try{ localStorage.removeItem('forja:'+key); }catch(e){}
}
async function loadDB(){
  const defaults = { routines: seedRoutines(), history: [], records: {}, profile:{name:'Atleta',bodyWeight:75,goal:'Ganar fuerza',units:'kg',restPref:90,notifications:true,theme:'dark'}, customExercises: [] };
  for(const key of Object.keys(defaults)){
    try{
      const v = await storageGet(key);
      DB[key] = v ? JSON.parse(v) : defaults[key];
    }catch(e){ DB[key] = defaults[key]; }
  }
  try{
    const v = await storageGet('session');
    DB.session = v ? JSON.parse(v) : null;
  }catch(e){ DB.session = null; }
  document.documentElement.setAttribute('data-theme', DB.profile.theme||'dark');
}
async function save(key){
  try{ await storageSet(key, JSON.stringify(DB[key])); }catch(e){ console.error('storage error',key,e); }
}
async function saveSession(){
  try{
    if(DB.session) await storageSet('session', JSON.stringify(DB.session));
    else await storageDelete('session');
  }catch(e){}
}

/* ============ AYUDANTES DE DATOS ============ */
function allExercises(){ return EXLIB.concat(DB.customExercises); }
function getRoutine(id){ return DB.routines.find(r=>r.id===id); }
function weekRange(d=new Date()){
  const day=(d.getDay()+6)%7; // lunes=0
  const start=new Date(d); start.setDate(d.getDate()-day); start.setHours(0,0,0,0);
  const end=new Date(start); end.setDate(start.getDate()+7);
  return [start,end];
}
function sessionsInRange(start,end){
  return DB.history.filter(s=>{ const t=new Date(s.date); return t>=start && t<end; });
}
function weekStats(){
  const [s,e]=weekRange();
  const sess=sessionsInRange(s,e);
  const dur=sess.reduce((a,x)=>a+x.duration,0);
  const exs=sess.reduce((a,x)=>a+x.exercises.length,0);
  const sets=sess.reduce((a,x)=>a+x.exercises.reduce((b,ex)=>b+ex.sets.filter(st=>st.completed).length,0),0);
  const vol=sess.reduce((a,x)=>a+x.totalVolume,0);
  return {count:sess.length,dur,exs,sets,vol,sessions:sess};
}
function lastSessionForRoutine(routineId){
  return DB.history.filter(s=>s.routineId===routineId).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
}
function suggestedRoutine(){
  if(!DB.routines.length) return null;
  let best=null, bestTime=Infinity;
  DB.routines.forEach(r=>{
    const last=lastSessionForRoutine(r.id);
    const t = last? new Date(last.date).getTime() : -1;
    if(t<bestTime){bestTime=t; best=r;}
  });
  return best;
}
function recentPRs(n=3){
  const list=[];
  Object.entries(DB.records).forEach(([exId,rec])=>{
    ['maxWeight','maxReps','bestVolumeSet'].forEach(k=>{
      if(rec[k]) list.push({exId,name:rec.name,type:k,...rec[k]});
    });
  });
  return list.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,n);
}
function lastSetsFor(exId){
  // busca la última sesión completada donde se hizo este ejercicio, devuelve array de sets {weight,reps}
  for(let i=DB.history.length-1;i>=0;i--){
    const s=DB.history[i];
    const ex=s.exercises.find(e=>e.exId===exId);
    if(ex) return ex.sets.filter(st=>st.completed);
  }
  return [];
}

/* ============ RÉCORDS ============ */
function checkAndUpdateRecord(exId,name,weight,reps,date){
  const vol=weight*reps;
  if(!DB.records[exId]) DB.records[exId]={name};
  const rec=DB.records[exId];
  let newPR=null;
  if(!rec.maxWeight || weight>rec.maxWeight.weight){ rec.maxWeight={weight,reps,date}; newPR='peso máximo'; }
  if(!rec.maxReps || reps>rec.maxReps.reps){ rec.maxReps={weight,reps,date}; newPR = newPR||'repeticiones'; }
  if(!rec.bestVolumeSet || vol>rec.bestVolumeSet.volume){ rec.bestVolumeSet={volume:vol,weight,reps,date}; newPR = newPR||'volumen de serie'; }
  return newPR;
}
function checkSessionVolumeRecord(exId,name,sessionVol,date){
  if(!DB.records[exId]) DB.records[exId]={name};
  const rec=DB.records[exId];
  if(!rec.bestSessionVolume || sessionVol>rec.bestSessionVolume.volume){
    rec.bestSessionVolume={volume:sessionVol,date};
    return true;
  }
  return false;
}

function lineChart(pts,color){
  if(!pts.length) return '';
  const w=280,h=90,pad=8;
  const maxY=Math.max(...pts.map(p=>p.y),1), minY=Math.min(...pts.map(p=>p.y),0);
  const rangeY=(maxY-minY)||1;
  const stepX = pts.length>1 ? (w-2*pad)/(pts.length-1) : 0;
  const coords=pts.map((p,i)=>[pad+i*stepX, h-pad-((p.y-minY)/rangeY)*(h-2*pad)]);
  const path=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area=path+` L${coords[coords.length-1][0].toFixed(1)},${h-pad} L${coords[0][0].toFixed(1)},${h-pad} Z`;
  const dots=coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.6" fill="${color}"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible;">
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}
function barChart(vals,color){
  const w=280,h=90,pad=6,gap=6;
  const max=Math.max(...vals,1);
  const bw=(w-2*pad-gap*(vals.length-1))/vals.length;
  const bars=vals.map((v,i)=>{ const bh=Math.max(2,(v/max)*(h-2*pad)); const x=pad+i*(bw+gap); const y=h-pad-bh; return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${color}"/>`; }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${bars}</svg>`;
}

function progressCalendar(){

  const trainedDays=new Set(DB.history.filter(s=>{const t=new Date(s.date); return t.getFullYear()===year && t.getMonth()===month;}).map(s=>new Date(s.date).getDate()));
  const monthLabel=m.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const selDay=STATE.calSelDay;

}
function progressStats(){
  const totalDur=DB.history.reduce((a,x)=>a+x.duration,0);
  const totalSets=DB.history.reduce((a,x)=>a+x.exercises.reduce((b,e)=>b+e.sets.filter(s=>s.completed).length,0),0);
  const totalReps=DB.history.reduce((a,x)=>a+x.exercises.reduce((b,e)=>b+e.sets.filter(s=>s.completed).reduce((c,s)=>c+s.reps,0),0),0);
  const totalVol=DB.history.reduce((a,x)=>a+x.totalVolume,0);

/* ============ MANEJO DE EVENTOS ============ */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

let restInterval=null;
function afterRender(){
  renderOverlays();
  if(STATE.view==='workout' && DB.session){
    startWorkoutClock();
  } else { stopWorkoutClock(); }
}
let clockInterval=null;
function startWorkoutClock(){
  stopWorkoutClock();
  clockInterval=setInterval(()=>{
    const el=document.getElementById('workoutClock');
    if(el && DB.session) el.textContent=fmtDur(Math.floor((Date.now()-DB.session.startedAt)/1000));
    else stopWorkoutClock();
  },1000);
}
function stopWorkoutClock(){ if(clockInterval){clearInterval(clockInterval); clockInterval=null;} }

function tickRest(){
  if(!STATE.restTimer || STATE.restTimer.paused) return;
  STATE.restTimer.remaining -= 1;
  if(STATE.restTimer.remaining<=0){
    STATE.restTimer.remaining=0;
    updateRestDOM();
    finishRest(true);
    return;
  }
  updateRestDOM();
}
function updateRestDOM(){
  const t=STATE.restTimer; if(!t) return;
  const txt=document.getElementById('restTimeText'); if(txt) txt.textContent=fmtClock(t.remaining);
  const circ=document.getElementById('restCircle');
  if(circ){ const pct=t.total>0?Math.max(0,t.remaining/t.total):0; const c2=2*Math.PI*100; circ.setAttribute('stroke-dashoffset',(c2*(1-pct)).toFixed(1)); }
}
function startRest(seconds, exName){
  if(restInterval) clearInterval(restInterval);
  STATE.restTimer={remaining:seconds, total:seconds, paused:false, exName};
  restInterval=setInterval(tickRest,1000);
  renderOverlays();
}
function finishRest(natural){
  if(restInterval){clearInterval(restInterval); restInterval=null;}
  STATE.restTimer=null;
  if(natural && navigator.vibrate){ try{navigator.vibrate([200,80,200]);}catch(e){} }
  renderOverlays();
}
function showPR(msg){
  STATE.prToast=msg;
  renderOverlays();
  setTimeout(()=>{ STATE.prToast=null; renderOverlays(); },2600);
}

const handlers = {
  'nav': (t)=>{ 
    const v=t.dataset.view;
    if(v==='workout' && !DB.session){ STATE.view='workout'; render(); return; }

  'start-routine': (t)=>{
    const r=getRoutine(t.dataset.id);
    if(!r) return;
    DB.session={
      id:uid(), routineId:r.id, routineName:r.name, startedAt:Date.now(), date:new Date().toISOString(),
      exercises:r.exercises.map(ex=>({exId:ex.exId||ex.id, name:ex.name, group:ex.group, notes:ex.notes, rest:ex.rest||DB.profile.restPref,
        sets:Array.from({length:ex.sets},()=>({weight:ex.weight, reps:ex.reps, completed:false}))}))
    };
    saveSession();
    STATE.view='workout'; render();
  },
  'confirm-cancel-workout': ()=>{
    STATE.confirm={title:'¿Cancelar entrenamiento?', body:'Se perderá el progreso de esta sesión.', confirmLabel:'Cancelar entrenamiento',
      onYes:()=>{ DB.session=null; saveSession(); STATE.view='dashboard'; render(); }};
    renderOverlays();
  },
  'add-set': (t)=>{
    const ei=+t.dataset.ei;
    const ex=DB.session.exercises[ei];
    const last=ex.sets[ex.sets.length-1];
    ex.sets.push({weight:last?last.weight:20, reps:last?last.reps:10, completed:false});
    saveSession(); render();
  },
  'set-step': (t)=>{
    const ei=+t.dataset.ei, si=+t.dataset.si, field=t.dataset.field, delta=parseFloat(t.dataset.delta);
    const st=DB.session.exercises[ei].sets[si];
    st[field]=Math.max(0, +(st[field]+delta).toFixed(2));
    saveSession(); render();
  },
  'toggle-set': (t)=>{
    const ei=+t.dataset.ei, si=+t.dataset.si;
    const ex=DB.session.exercises[ei]; const st=ex.sets[si];
    st.completed=!st.completed;
    if(st.completed){
      const prName=checkAndUpdateRecord(ex.exId, ex.name, st.weight, st.reps, DB.session.date);
      save('records');
      if(prName) showPR('¡Nuevo récord! '+prName);
      // iniciar descanso si no es la última serie de la última seleccion global (siempre inicia si hay más series pendientes en general)
      const isLastOverall = (ei===DB.session.exercises.length-1) && (si===ex.sets.length-1);
      if(!isLastOverall) startRest(ex.rest||DB.profile.restPref, ex.name);
    } else {
      finishRest(false);
    }
    saveSession(); render();
  },
  'rest-toggle': ()=>{ if(STATE.restTimer){ STATE.restTimer.paused=!STATE.restTimer.paused; renderOverlays(); } },
  'rest-add': (t)=>{ if(STATE.restTimer){ STATE.restTimer.remaining=Math.max(0,STATE.restTimer.remaining+ (+t.dataset.delta)); STATE.restTimer.total=Math.max(STATE.restTimer.total,STATE.restTimer.remaining); updateRestDOM(); } },
  'rest-preset': (t)=>{ if(STATE.restTimer){ const s=+t.dataset.sec; STATE.restTimer.remaining=s; STATE.restTimer.total=s; renderOverlays(); } },
  'rest-skip': ()=>{ finishRest(false); },
  'finish-workout': ()=>{
    const sess=DB.session;
    const anySets = sess.exercises.some(e=>e.sets.some(s=>s.completed));
    if(!anySets){
      STATE.confirm={title:'Sin series completadas', body:'No has completado ninguna serie. ¿Finalizar de todas formas?', confirmLabel:'Finalizar',
        onYes:()=>{ completeWorkout(); }};
      renderOverlays(); return;
    }
    completeWorkout();
  },
  'progress-tab': (t)=>{ STATE.progressTab=t.dataset.tab; render(); },
  'cal-nav': (t)=>{ const d=+t.dataset.dir; STATE.calMonth=new Date(STATE.calMonth.getFullYear(), STATE.calMonth.getMonth()+d, 1); STATE.calSelDay=null; render(); },
  'cal-select': (t)=>{ STATE.calSelDay = STATE.calSelDay===+t.dataset.day ? null : +t.dataset.day; render(); },
  'open-history': (t)=>{ STATE.historyDetail=t.dataset.id; showHistoryDetail(t.dataset.id); },
  'new-routine': ()=>{ STATE.editingRoutine={id:uid(), name:'Nueva rutina', group:'Personalizado', notes:'', exercises:[]}; STATE.exSearch=''; STATE.exFilter='Todos'; STATE.view='routineEditor'; render(); },
  'edit-routine': (t)=>{ STATE.editingRoutine=JSON.parse(JSON.stringify(getRoutine(t.dataset.id))); STATE.exSearch=''; STATE.exFilter='Todos'; STATE.view='routineEditor'; render(); },
  'open-routine': (t)=>{ handlers['edit-routine'](t); },
  'duplicate-routine': (t)=>{
    const r=getRoutine(t.dataset.id);
    const copy=JSON.parse(JSON.stringify(r)); copy.id=uid(); copy.name=r.name+' (copia)'; copy.exercises.forEach(e=>e.id=uid());
    DB.routines.push(copy); save('routines'); render();
  },
  'delete-routine': (t)=>{
    const id=t.dataset.id; const r=getRoutine(id);
    STATE.confirm={title:'Eliminar rutina', body:`¿Eliminar "${r.name}"? Esta acción no se puede deshacer.`,
      onYes:()=>{ DB.routines=DB.routines.filter(x=>x.id!==id); save('routines'); render(); }};
    renderOverlays();
  },
  'filter-routines': (t)=>{ STATE.routineFilter=t.dataset.group; render(); },
  'filter-exlib': (t)=>{ STATE.exFilter=t.dataset.group; render(); },
  'ex-add': (t)=>{
    const ex=allExercises().find(e=>e.id===t.dataset.exid);
    STATE.editingRoutine.exercises.push({id:uid(), exId:ex.id, name:ex.name, group:ex.group, sets:3, reps:10, weight:20, rest:DB.profile.restPref, notes:''});
    render();
  },
  'ex-remove': (t)=>{ STATE.editingRoutine.exercises.splice(+t.dataset.i,1); render(); },
  'ex-move': (t)=>{
    const i=+t.dataset.i, dir=+t.dataset.dir; const arr=STATE.editingRoutine.exercises;
    const j=i+dir; if(j<0||j>=arr.length) return;
    [arr[i],arr[j]]=[arr[j],arr[i]]; render();
  },
  'new-custom-ex': ()=>{ STATE.newExOverlay={name:''}; renderOverlays(); },
  'close-new-ex': ()=>{ STATE.newExOverlay=null; renderOverlays(); },
  'save-custom-ex': ()=>{
    const name=document.getElementById('newExName').value.trim();
    const group=document.getElementById('newExGroup').value;
    if(!name) return;
    const newEx={id:uid(), name, group};
    DB.customExercises.push(newEx); save('customExercises');
    STATE.editingRoutine.exercises.push({id:uid(), exId:newEx.id, name:newEx.name, group:newEx.group, sets:3, reps:10, weight:20, rest:DB.profile.restPref, notes:''});
    STATE.newExOverlay=null; render();
  },
  'save-routine': ()=>{
    const r=STATE.editingRoutine;
    if(!r.name.trim()) r.name='Rutina sin nombre';
    const idx=DB.routines.findIndex(x=>x.id===r.id);
    if(idx>=0) DB.routines[idx]=r; else DB.routines.push(r);
    save('routines'); STATE.view='routines'; render();
  },
  'confirm-yes': ()=>{ const c=STATE.confirm; STATE.confirm=null; if(c&&c.onYes) c.onYes(); renderOverlays(); },
  'confirm-no': ()=>{ STATE.confirm=null; renderOverlays(); },
  'close-summary': ()=>{ STATE.summary=null; STATE.view='dashboard'; render(); },
  'toggle-notif': ()=>{ DB.profile.notifications=!DB.profile.notifications; save('profile'); render(); },
  'toggle-theme': ()=>{ DB.profile.theme = DB.profile.theme==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',DB.profile.theme); save('profile'); render(); },
};

function completeWorkout(){
  const sess=DB.session;
  const duration=(Date.now()-sess.startedAt)/1000;
  let totalVolume=0, totalSets=0, newPRs=0;
  sess.exercises.forEach(ex=>{
    let exVol=0;
    ex.sets.forEach(st=>{ if(st.completed){ totalSets++; totalVolume+=st.weight*st.reps; exVol+=st.weight*st.reps; } });
    if(exVol>0){ const isNew=checkSessionVolumeRecord(ex.exId, ex.name, exVol, sess.date); if(isNew) newPRs++; }
  });
  // contar PRs de peso/reps logrados durante la sesión (ya aplicados en tiempo real); aproximamos comparando fecha de record == fecha de sesión
  Object.values(DB.records).forEach(r=>{
    ['maxWeight','maxReps','bestVolumeSet'].forEach(k=>{ if(r[k] && r[k].date===sess.date) newPRs++; });
  });
  const prevSession=DB.history.filter(s=>s.routineId===sess.routineId).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const compare = prevSession? totalVolume-prevSession.totalVolume : null;

  const historyEntry={ id:sess.id, routineId:sess.routineId, routineName:sess.routineName, date:sess.date, duration,
    exercises: sess.exercises.map(ex=>({exId:ex.exId, name:ex.name, group:ex.group, sets:ex.sets})),
    totalVolume, totalSets, notes:'' };
  DB.history.push(historyEntry);
  save('history'); save('records');
  STATE.summary={ routineName:sess.routineName, duration, exercises:sess.exercises, totalSets, totalVolume, newPRs, compare };
  DB.session=null; saveSession();
  finishRest(false);
  render();
}

function showHistoryDetail(id){
  const s=DB.history.find(x=>x.id===id);
  if(!s) return;
  const el=document.getElementById('overlays');
  const extra=document.createElement('div');
  extra.innerHTML=`<div class="overlay" id="histOverlay"><div class="sheet">
    <div class="sheet-grabber"></div>
    <div class="row"><h3>${escapeHtml(s.routineName)}</h3><button class="icon-btn" data-action="close-hist">${ICONS.close}</button></div>
    <div class="small muted mb8">${fmtDate(s.date)} · ${fmtDurShort(s.duration)} · ${fmtVol(s.totalVolume)}</div>
    <div class="stack">
    ${s.exercises.map(ex=>`<div class="item-card">
      <div style="font-weight:700;">${escapeHtml(ex.name)}</div>
      <div class="stack mt8">${ex.sets.map((st,i)=>`<div class="row small ${st.completed?'':'faint'}"><span>Serie ${i+1}</span><span>${st.weight}${DB.profile.units} × ${st.reps} ${st.completed?'✓':'(no completada)'}</span></div>`).join('')}</div>
    </div>`).join('')}
    </div>
    <button class="btn btn-danger btn-block mt16" data-action="delete-history" data-id="${s.id}">${ICONS.trash} Eliminar entrenamiento</button>
  </div></div>`;
  el.appendChild(extra.firstChild);
}
handlers['close-hist']=()=>{ const o=document.getElementById('histOverlay'); if(o) o.remove(); STATE.historyDetail=null; };
handlers['delete-history']=(t)=>{
  const id=t.dataset.id;
  STATE.confirm={title:'Eliminar entrenamiento', body:'Esta acción no se puede deshacer.', onYes:()=>{
    DB.history=DB.history.filter(x=>x.id!==id); save('history');
    const o=document.getElementById('histOverlay'); if(o) o.remove();
    render();
  }};
  renderOverlays();
};

/* input events (no full re-render para no perder foco) */
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.bind){ STATE[t.dataset.bind]=t.value; if(t.dataset.bind==='routineSearch'||t.dataset.bind==='exSearch'){ /* live filter without full rerender of input */ softRerenderList(); } }
  if(t.dataset.redit && STATE.editingRoutine){ STATE.editingRoutine[t.dataset.redit]=t.value; }
  if(t.dataset.exedit){
    const i=+t.dataset.i; const field=t.dataset.exedit;
    const val = (field==='sets'||field==='reps') ? parseInt(t.value)||0 : (field==='notes'? t.value : parseFloat(t.value)||0);
    STATE.editingRoutine.exercises[i][field]=val;
  }
  if(t.dataset.pedit){
    const f=t.dataset.pedit; const val=(f==='bodyWeight'||f==='restPref')?parseFloat(t.value)||0:t.value;
    DB.profile[f]=val; save('profile');
  }
  if(t.dataset.actionInput==='set-val'){
    const ei=+t.dataset.ei, si=+t.dataset.si, field=t.dataset.field;
    DB.session.exercises[ei].sets[si][field]=parseFloat(t.value)||0;
    saveSession();
  }
  if(t.dataset.actionInput==='select-ex'){ STATE.selectedExId=t.value; render(); }
});
function softRerenderList(){
  // re-render solo la vista actual (aceptable, el input principal pierde foco brevemente pero es poco frecuente)
  const active=document.activeElement;
  const wasBind=active && active.dataset && active.dataset.bind;
  const selStart=wasBind?active.selectionStart:null;
  render();
  if(wasBind){
    const el=document.querySelector(`[data-bind="${wasBind}"]`);
    if(el){ el.focus(); if(selStart!=null) el.setSelectionRange(selStart,selStart); }
  }
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-action]');
  if(!t) return;
  const action=t.dataset.action;
  if(handlers[action]) handlers[action](t,e);
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.tagName==='SELECT' && t.dataset.redit && STATE.editingRoutine){ STATE.editingRoutine[t.dataset.redit]=t.value; }
  if(t.tagName==='SELECT' && t.dataset.pedit){ DB.profile[t.dataset.pedit]=t.value; save('profile'); render(); }
});

/* ============ INIT ============ */
async function init(){
  document.getElementById('root').style.display='none';
  const loader=document.createElement('div');
  loader.className='loading-screen'; loader.id='loader';
  loader.innerHTML=`<div class="spinner"></div><div class="muted small">Cargando FORJA...</div>`;
  document.body.appendChild(loader);
  await loadDB();
  loader.remove();
  document.getElementById('root').style.display='';
  render();
}
init();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script>
